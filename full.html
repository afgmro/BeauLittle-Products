<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>完整情绪筛查自测</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #333;
      line-height: 1.65;
      padding: 16px;
    }
    .container {
      max-width: 540px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .title { font-size: 20px; font-weight: 600; margin-bottom:8px; text-align:center; }
    .sub-desc { text-align:center; color:#666; font-size:14px; margin-bottom:24px; }
    .warn-box {
      background:#fff3cd;
      border-radius:10px;
      padding:12px 14px;
      font-size:13px;
      color:#856404;
      margin-bottom:20px;
    }
    .question-item { margin-bottom:20px; }
    .q-text { font-size:15px; margin-bottom:10px; }
    .opt-group { display:flex; flex-wrap:wrap; gap:8px; }
    .opt-btn {
      flex:1; min-width:100px;
      padding:10px 6px;
      border:1px solid #ddd;
      border-radius:8px;
      background:#fff;
      cursor:pointer;
      font-size:14px;
      text-align:center;
      transition:0.2s;
    }
    .opt-btn.active {
      background:#4080ff;
      color:#fff;
      border-color:#4080ff;
    }
    .btn-submit {
      width:100%;
      padding:13px;
      background:#2b78e4;
      color:#fff;
      border:none;
      border-radius:10px;
      font-size:16px;
      margin-top:10px;
      cursor:pointer;
    }
    .btn-submit:disabled { background:#94b8ec; cursor:not-allowed; }
    .result-area { margin-top:22px; display:none; }
    .score-text { font-size:17px; font-weight:600; margin-bottom:10px; }
    .result-desc { font-size:14px; background:#f7f8fa; padding:14px; border-radius:10px; }
    .btn-reset {
      width:100%;
      margin-top:16px;
      padding:11px;
      border:1px solid #bbb;
      background:#fff;
      border-radius:10px;
      cursor:pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="title">完整情绪筛查自测</h2>
  <div class="sub-desc">适合纠结是否前往医院就诊人群｜仅供参考，不替代面诊</div>
  <div class="warn-box">
    ⚠️重要免责：本测试仅作情绪参考，<b>不能替代精神科/心理医生诊断</b>，不能作为疾病判断、就医依据。如果痛苦感强烈，请尽快寻求线下专业帮助。
  </div>

  <div id="quizWrap"></div>

  <button class="btn-submit" id="submitBtn" disabled>查看结果</button>

  <div class="result-area" id="resultWrap">
    <div class="score-text" id="scoreText"></div>
    <div class="result-desc" id="resultText"></div>
    <button class="btn-reset" id="resetBtn">重新测试</button>
  </div>
</div>

<script>
const phq9 = [
  "做事时提不起劲或没有兴趣",
  "感到心情低落、沮丧或绝望",
  "入睡困难、睡不安稳或睡得过多",
  "感到疲倦或没有精力",
  "食欲不振或吃太多",
  "觉得自己很失败，或让自己、家人失望",
  "对事物专注有困难，例如阅读报纸或看电视时",
  "动作或说话速度缓慢到别人已经察觉；或正好相反，烦躁或坐立不安、动来动去",
  "有不如死掉，或用某种方式伤害自己的念头"
];
const extraQs = [
  "近两周是否经常莫名焦虑紧张",
  "睡眠问题是否已经明显影响日常生活工作",
  "躯体不适（头疼、肠胃不适）频繁但检查无明显器质性问题"
];
const qList = [...phq9, ...extraQs];
const optLabels = ["完全没有", "几天", "一半以上天数", "几乎每天"];

const quizWrap = document.getElementById('quizWrap');
const submitBtn = document.getElementById('submitBtn');
const resultWrap = document.getElementById('resultWrap');
const scoreText = document.getElementById('scoreText');
const resultText = document.getElementById('resultText');
const resetBtn = document.getElementById('resetBtn');

let answers = Array(qList.length).fill(null);

function renderQuestions(){
  quizWrap.innerHTML = '';
  qList.forEach((qStr, idx)=>{
    const div = document.createElement('div');
    div.className = 'question-item';
    div.innerHTML = `
      <div class="q-text">${idx+1}. ${qStr}</div>
      <div class="opt-group" data-idx="${idx}">
        ${optLabels.map((lab, val)=>`<button class="opt-btn" data-val="${val}">${lab}</button>`).join('')}
      </div>
    `;
    quizWrap.appendChild(div);
  })
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = function(){
      const parent = this.closest('.opt-group');
      const i = Number(parent.dataset.idx);
      const v = Number(this.dataset.val);
      answers[i] = v;
      parent.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      checkReady();
    }
  })
}

function checkReady(){
  submitBtn.disabled = answers.some(x=> x===null);
}

function calcScore(){
  return answers.slice(0,9).reduce((s,v)=> s+v,0);
}

function getPhqInterpret(score){
  if(score <=4) return "分数：0‑4分｜无显著抑郁情绪倾向，保持作息，多关注自我状态即可。";
  if(score <=9) return "分数：5‑9分｜轻度情绪困扰，可以自我调节观察，如果持续难受建议寻求专业帮助。";
  if(score <=14) return "分数：10‑14分｜中度情绪困扰，已经比较影响生活，建议优先考虑心理门诊评估。";
  if(score <=19) return "分数：15‑19分｜中重度情绪困扰，强烈建议尽快到精神心理科面诊。";
  return "分数：20‑27分｜重度情绪困扰，请务必尽快寻求线下专业医疗帮助，不要独自硬扛。";
}

submitBtn.onclick = function(){
  const s = calcScore();
  scoreText.innerText = "你的PHQ‑9得分："+s;
  let res = getPhqInterpret(s);
  res += "\n\n【完整版提示】本套包含附加筛查项，附加题目不计入PHQ‑9标准分数。自测结果不能代替医生面诊；如果你持续两周以上痛苦，优先医院就诊评估。";
  resultText.innerText = res;
  resultWrap.style.display = 'block';
}

resetBtn.onclick = function(){
  answers = Array(qList.length).fill(null);
  resultWrap.style.display = 'none';
  renderQuestions();
  checkReady();
}
renderQuestions();
</script>
</body>
</html>
