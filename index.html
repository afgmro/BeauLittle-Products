<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHQ-9 抑郁自测</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #333;
      line-height: 1.6;
      padding: 16px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 6px;
      color: #1a1a1a;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }
    .disclaimer {
      background: #fff8e1;
      border-left: 3px solid #ffc107;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid #f0f0f0;
    }
    .question:last-of-type { border-bottom: none; }
    .question p {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .question label {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin: 4px 0;
      border-radius: 8px;
      background: #f8f8fa;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .question label:hover { background: #eef0ff; }
    .question label.selected { background: #e0e4ff; }
    .question input[type="radio"] {
      margin-right: 10px;
      accent-color: #5b6cff;
    }
    .suicide-warning {
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      font-size: 13px;
      color: #c62828;
      display: none;
    }
    .suicide-warning.show { display: block; }
    button {
      width: 100%;
      padding: 14px;
      background: #5b6cff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    button:hover { background: #4a5ae8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      display: none;
    }
    #result.show { display: block; }
    #result h3 { margin-bottom: 8px; font-size: 16px; }
    #result p { font-size: 14px; }
    .score-bar {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      margin: 12px 0;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PHQ-9 抑郁自测</h1>
    <p class="subtitle">过去两周，你被以下问题困扰的频率是？</p>

    <div class="disclaimer">
      ⚠️ 本测试仅作心理健康筛查参考，不能代替专业医生的诊断。如有需要请咨询精神科或心理科医生。
    </div>

    <form id="quiz-form">
      <!-- 题目由 JS 渲染 -->
    </form>

    <div class="suicide-warning" id="suicide-warning">
      🆘 <strong>重要提醒：</strong>你报告了有自伤或轻生的念头。<br/>
      请立即联系以下资源获取帮助：<br/>
      · 全国心理援助热线：400-161-9995<br/>
      · 北京心理危机干预中心：010-82951332<br/>
      · 或直接前往最近的医院急诊科<br/>
      你并不孤单，请务必向信任的人倾诉。
    </div>

    <button id="submit-btn" disabled>提交测试</button>

    <div id="result"></div>

    <p class="footer">
      PHQ-9 量表为公有领域工具，广泛用于临床筛查 | 本页面不收集任何个人信息
    </p>
  </div>

  <script>
    const questions = [
      "做事时提不起劲或没有兴趣",
      "感到心情低落、沮丧或绝望",
      "入睡困难、睡不安稳或睡眠过多",
      "感觉疲倦或没有活力",
      "食欲不振或吃太多",
      "觉得自己很糟，或觉得自己很失败，或让自己/家人失望",
      "对事物专注有困难，例如阅读报纸或看电视时",
      "动作或说话速度缓慢到别人可以察觉，或正好相反——烦躁或坐立不安、动来动去的情况更胜于平常",
      "有不如死掉或用某种方式伤害自己的念头"
    ];

    const options = [
      { text: "完全不会", value: 0 },
      { text: "几天", value: 1 },
      { text: "一半以上天数", value: 2 },
      { text: "几乎每天", value: 3 }
    ];

    const form = document.getElementById("quiz-form");
    const submitBtn = document.getElementById("submit-btn");
    const resultDiv = document.getElementById("result");
    const suicideWarning = document.getElementById("suicide-warning");

    // 渲染题目
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<p>${i + 1}. ${q}</p>`;
      options.forEach(opt => {
        div.innerHTML += `
          <label>
            <input type="radio" name="q${i}" value="${opt.value}" />
            ${opt.text}
          </label>`;
      });
      form.appendChild(div);
    });

    // 选中高亮 + 检查是否全部答完
    form.addEventListener("change", () => {
      document.querySelectorAll(".question label").forEach(label => {
        label.classList.remove("selected");
      });
      document.querySelectorAll("input:checked").forEach(input => {
        input.closest("label").classList.add("selected");
      });

      const answered = form.querySelectorAll("input:checked").length;
      submitBtn.disabled = answered < 9;
    });

    // 提交算分
    submitBtn.addEventListener("click", () => {
      let score = 0;
      let suicideScore = 0;

      for (let i = 0; i < 9; i++) {
        const val = Number(form.querySelector(`input[name="q${i}"]:checked`).value);
        score += val;
        if (i === 8) suicideScore = val;
      }

      // 第 9 题非零 → 强制显示危机提醒
      if (suicideScore > 0) {
        suicideWarning.classList.add("show");
      }

      // 档位判定
      let level, color, advice;
      if (score <= 4) {
        level = "无明显抑郁症状";
        color = "#4caf50";
        advice = "你的状态目前较好。保持规律作息、适度运动和社交，继续关注自己的心情变化。";
      } else if (score <= 9) {
        level = "轻度抑郁症状";
        color = "#8bc34a";
        advice = "近期可能有一些情绪低谷。建议多关注自我关怀，尝试与信任的人聊聊，如果持续两周以上未缓解，建议寻求心理咨询。";
      } else if (score <= 14) {
        level = "中度抑郁症状";
        color = "#ff9800";
        advice = "建议尽快与心理咨询师或精神科医生沟通，评估是否需要进一步干预。你不需要独自面对。";
      } else if (score <= 19) {
        level = "中重度抑郁症状";
        color = "#ff5722";
        advice = "建议尽快就医。精神科医生可以帮你评估是否需要药物治疗或心理治疗，这是可以治疗的。";
      } else {
        level = "重度抑郁症状";
        color = "#f44336";
        advice = "请尽快前往精神科就诊。重度抑郁是可以治疗的，专业帮助能让你重新找回生活的色彩。";
      }

      const pct = Math.min(score / 27 * 100, 100);

      resultDiv.innerHTML = `
        <h3>你的得分：${score} / 27</h3>
        <div class="score-bar">
          <div class="score-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <p><strong style="color:${color}">${level}</strong></p>
        <p style="margin-top:8px;">${advice}</p>
        <p style="margin-top:12px;font-size:12px;color:#999;">再次提醒：本结果仅供参考，不能代替专业诊断。</p>
      `;
      resultDiv.className = "show";
      resultDiv.style.background = "#f8f9ff";
      resultDiv.style.border = "1px solid #e0e4ff";

      // 滚动到结果
      resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  </script>
</body>
</html>
