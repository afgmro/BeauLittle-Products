<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>简易情绪自测</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #333;
      line-height: 1.65;
      padding: 16px;
    }
    .container {
      max-width: 540px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .title { font-size: 20px; font-weight: 600; margin-bottom:8px; text-align:center; }
    .sub-desc { text-align:center; color:#666; font-size:14px; margin-bottom:16px; }
    .warn-box {
      background:#fff3cd;
      border-radius:10px;
      padding:12px 14px;
      font-size:13px;
      color:#856404;
      margin-bottom:20px;
    }
    /* 进度条 */
    .progress-wrap {
      width:100%;
      height:8px;
      background:#e9ecef;
      border-radius:99px;
      margin-bottom:24px;
      overflow:hidden;
    }
    .progress-bar {
      height:100%;
      background:#4080ff;
      width:0%;
      transition: 0.3s width;
    }
    .progress-text {
      text-align:center;
      font-size:13px;
      color:#666;
      margin-bottom:16px;
    }
    .question-item { margin-bottom:24px; }
    .q-text { font-size:16px; margin-bottom:20px; text-align:center; }
    .opt-group { display:flex; flex-wrap:wrap; gap:10px; }
    .opt-btn {
      flex:1 0 42%;
      padding:14px 8px;
      border:1px solid #ddd;
      border-radius:8px;
      background:#fff;
      cursor:pointer;
      font-size:14px;
      text-align:center;
      transition:0.2s;
    }
    .opt-btn.active {
      background:#4080ff;
      color:#fff;
      border-color:#4080ff;
    }
    .btn-area { display:flex; gap:12px; margin-top:20px; }
    .btn-prev,.btn-next {
      flex:1;
      padding:12px;
      border-radius:10px;
      font-size:15px;
      cursor:pointer;
    }
    .btn-prev {
      border:1px solid #bbb;
      background:#fff;
    }
    .btn-next {
      border:none;
      background:#2b78e4;
      color:#fff;
    }
    .btn-next:disabled { background:#94b8ec; cursor:not-allowed; }
    .result-area { margin-top:22px; display:none; }
    .score-text { font-size:17px; font-weight:600; margin-bottom:10px; text-align:center; }
    .result-desc { font-size:14px; background:#f7f8fa; padding:14px; border-radius:10px; white-space:pre-line; }
    .btn-reset {
      width:100%;
      margin-top:16px;
      padding:11px;
      border:1px solid #bbb;
      background:#fff;
      border-radius:10px;
      cursor:pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="title">简易情绪自测</h2>
  <div class="sub-desc">快速了解近期情绪状态｜仅供娱乐参考</div>
  <div class="warn-box">
    ⚠️重要免责：本测试仅作情绪参考，<b>不能替代精神科/心理医生诊断</b>，不能作为疾病判断、就医依据。如果痛苦感强烈，请尽快寻求线下专业帮助。
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText"></div>

  <div id="quizWrap"></div>

  <div class="btn-area">
    <button class="btn-prev" id="prevBtn" style="display:none;">上一题</button>
    <button class="btn-next" id="nextBtn">下一题</button>
  </div>

  <div class="result-area" id="resultWrap">
    <div class="score-text" id="scoreText"></div>
    <div class="result-desc" id="resultText"></div>
    <button class="btn-reset" id="resetBtn">重新测试</button>
  </div>
</div>

<script>
// PHQ‑9 9题 + 轻量版额外4道简易题目（不计入PHQ‑9分数）
const phq9 = [
  "做事时提不起劲或没有兴趣",
  "感到心情低落、沮丧或绝望",
  "入睡困难、睡不安稳或睡得过多",
  "感到疲倦或没有精力",
  "食欲不振或吃太多",
  "觉得自己很失败，或让自己、家人失望",
  "对事物专注有困难，例如阅读报纸或看电视时",
  "动作或说话速度缓慢到别人已经察觉；或正好相反，烦躁或坐立不安、动来动去",
  "有不如死掉，或用某种方式伤害自己的念头"
];
// 轻量版新增补充题（不计入PHQ‑9计分）
const lightExtra = [
  "容易因为小事感到烦躁生气",
  "对以前喜欢的事情兴趣下降",
  "容易觉得压力大、心里紧绷",
  "经常觉得孤单或者闷闷不乐"
];
const totalQuestions = [...phq9, ...lightExtra];
const optLabels = ["完全没有", "几天", "一半以上天数", "几乎每天"];

const quizWrap = document.getElementById('quizWrap');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resultWrap = document.getElementById('resultWrap');
const scoreText = document.getElementById('scoreText');
const resultText = document.getElementById('resultText');
const resetBtn = document.getElementById('resetBtn');

let currentIndex = 0;
let answers = Array(totalQuestions.length).fill(null);

// 更新进度条
function updateProgress(){
  const percent = ((currentIndex+1)/totalQuestions.length)*100;
  progressBar.style.width = percent + "%";
  progressText.innerText = `第 ${currentIndex+1} / ${totalQuestions.length} 题`;
}

//渲染当前单题
function renderCurrentQuestion(){
  quizWrap.innerHTML = '';
  const qStr = totalQuestions[currentIndex];
  const div = document.createElement('div');
  div.className = 'question-item';
  div.innerHTML = `
    <div class="q-text">${qStr}</div>
    <div class="opt-group">
      ${optLabels.map((lab, val)=>`
        <button class="opt-btn ${answers[currentIndex]===val?'active':''}" data-val="${val}">${lab}</button>
      `).join('')}
    </div>
  `;
  quizWrap.appendChild(div);

  //选项点击
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = function(){
      const v = Number(this.dataset.val);
      answers[currentIndex] = v;
      document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      nextBtn.disabled = false;
    }
  })

  prevBtn.style.display = currentIndex>0 ? 'block':'none';
  nextBtn.innerText = (currentIndex === totalQuestions.length-1) ? "查看结果":"下一题";
  nextBtn.disabled = answers[currentIndex]===null;
  updateProgress();
}

//计算分数：只取前9道PHQ‑9
function calcScore(){
  return answers.slice(0,9).reduce((s,v)=> s+v,0);
}

function getPhqInterpret(score){
  if(score <=4) return "分数：0‑4分｜无显著抑郁情绪倾向，保持作息，多关注自我状态即可。";
  if(score <=9) return "分数：5‑9分｜轻度情绪困扰，可以自我调节观察，如果持续难受建议寻求专业帮助。";
  if(score <=14) return "分数：10‑14分｜中度情绪困扰，已经比较影响生活，建议优先考虑心理门诊评估。";
  if(score <=19) return "分数：15‑19分｜中重度情绪困扰，强烈建议尽快到精神心理科面诊。";
  return "分数：20‑27分｜重度情绪困扰，请务必尽快寻求线下专业医疗帮助，不要独自硬扛。";
}

//下一题/提交
nextBtn.onclick = function(){
  if(currentIndex < totalQuestions.length -1){
    currentIndex++;
    renderCurrentQuestion();
  }else{
    //最后一题，输出结果
    const s = calcScore();
    scoreText.innerText = "你的PHQ‑9得分："+s;
    let res = getPhqInterpret(s);
    res += "\n\n【轻量版提示】简易版本仅供趣味自测，附加题目不计入计分，结果参考意义有限。";
    resultText.innerText = res;
    //隐藏答题区域
    quizWrap.style.display = 'none';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    progressBar.style.display = 'none';
    progressText.style.display = 'none';
    resultWrap.style.display = 'block';
  }
}

prevBtn.onclick = function(){
  if(currentIndex>0){
    currentIndex--;
    renderCurrentQuestion();
  }
}

resetBtn.onclick = function(){
  currentIndex = 0;
  answers = Array(totalQuestions.length).fill(null);
  quizWrap.style.display = 'block';
  prevBtn.style.display = 'none';
  nextBtn.style.display = 'block';
  progressBar.style.display = 'block';
  progressText.style.display = 'block';
  resultWrap.style.display = 'none';
  renderCurrentQuestion();
}

//初始化
renderCurrentQuestion();
</script>
</body>
</html>
